# Production-ready Docker Compose configuration
# Use: docker compose -f docker-compose.prod.yml up -d

version: "3.8"

services:
  # ==================== FRONTEND ====================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: givesgain-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=${API_URL}/api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - givesgain-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - mongo

  # ==================== DATABASE ====================
  mongo:
    image: mongo:latest
    container_name: givesgain-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-changeme}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
      - mongo-configdb:/data/configdb
    networks:
      - givesgain-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== USER SERVICE ====================
  user-service:
    build: ./backend/user-service
    container_name: givesgain-user-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=${MONGO_URI_USERS}
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - givesgain-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/users/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== PRODUCT SERVICE ====================
  product-service:
    build: ./backend/product-service
    container_name: givesgain-product-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5001
      - MONGO_URI=${MONGO_URI_PRODUCTS}
    ports:
      - "5001:5001"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - givesgain-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/products"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== CART SERVICE ====================
  cart-service:
    build: ./backend/shopping-cart-service
    container_name: givesgain-cart-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5002
      - MONGO_URI=${MONGO_URI_CART}
      - PRODUCT_SERVICE_URI=http://product-service:5001
    ports:
      - "5002:5002"
    depends_on:
      mongo:
        condition: service_healthy
      product-service:
        condition: service_healthy
    networks:
      - givesgain-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/api/cart"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== ORDER SERVICE ====================
  order-service:
    build: ./backend/order-service
    container_name: givesgain-order-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5003
      - MONGO_URI=${MONGO_URI_ORDER}
      - PRODUCT_SERVICE_URI=http://product-service:5001
      - USER_SERVICE_URI=http://user-service:5000
      - NOTIFICATION_SERVICE_URI=http://notification-service:5005
    ports:
      - "5003:5003"
    depends_on:
      mongo:
        condition: service_healthy
      product-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    networks:
      - givesgain-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/api/orders"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== PAYMENT SERVICE ====================
  payment-service:
    build: ./backend/payment-service
    container_name: givesgain-payment-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5004
      - MONGO_URI=${MONGO_URI_PAYMENT}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
    ports:
      - "5004:5004"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - givesgain-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5004/api/payments"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== NOTIFICATION SERVICE ====================
  notification-service:
    build: ./backend/notification-service
    container_name: givesgain-notification-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5005
      - NODEMAILER_EMAIL=${NODEMAILER_EMAIL}
      - NODEMAILER_PASSWORD=${NODEMAILER_PASSWORD}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
    ports:
      - "5005:5005"
    networks:
      - givesgain-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5005/api/notification/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== NGINX GATEWAY ====================
  nginx:
    image: nginx:alpine
    container_name: givesgain-nginx
    restart: unless-stopped
    ports:
      - "${API_GATEWAY_PORT:-80}:80"
      - "443:443"
    volumes:
      - ./backend/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - user-service
      - product-service
      - cart-service
      - order-service
      - payment-service
      - notification-service
    networks:
      - givesgain-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ==================== VOLUMES ====================
volumes:
  mongo-data:
    driver: local
  mongo-configdb:
    driver: local

# ==================== NETWORKS ====================
networks:
  givesgain-network:
    driver: bridge