# Railway Configuration File
# https://docs.railway.app/reference/nixpacks

# Detecta automáticamente el tipo de proyecto y cómo hacer build

[build]
# Instalar dependencias
builder = "nixpacks"

# Si la detección automática falla, especificar:
# - Para frontend Vite: 
#   builder = "vite"
#   build_command = "npm run build"
#   start_command = "npm run preview"

[deploy]
# Inject VITE_MESSAGING_API_BASE_URL from Railway env vars at runtime, then
# start the Vite preview server.
startCommand = "sh -c 'sed -i \"s|__MESSAGING_API_BASE_URL__|${VITE_MESSAGING_API_BASE_URL}|g\" dist/index.html && npm run preview -- --host 0.0.0.0 --port $PORT'"

# Para backend services, Railway detectará automáticamente Express.js
