# Railway Configuration File
# https://docs.railway.app/reference/nixpacks

# Detecta automáticamente el tipo de proyecto y cómo hacer build

[build]
# Instalar dependencias
builder = "nixpacks"

# Si la detección automática falla, especificar:
# - Para frontend Vite: 
#   builder = "vite"
#   build_command = "npm run build"
#   start_command = "npm run preview"

[deploy]
startCommand = "sh -c 'sed -i \"s|__VITE_USERS_API_BASE_URL__|${VITE_USERS_API_BASE_URL:-https://humorous-essence-production-cf27.up.railway.app}|g; s|__VITE_PRODUCTS_API_BASE_URL__|${VITE_PRODUCTS_API_BASE_URL:-https://nuevavida-production.up.railway.app}|g; s|__VITE_MESSAGING_API_BASE_URL__|${VITE_MESSAGING_API_BASE_URL:-https://messaging-service-production-1fb5.up.railway.app}|g; s|__VITE_ORDERS_API_BASE_URL__|${VITE_ORDERS_API_BASE_URL:-https://order-service-production-3512.up.railway.app}|g; s|__VITE_ADMIN_API_BASE_URL__|${VITE_ADMIN_API_BASE_URL:-https://admin-service-production-84e9.up.railway.app}|g\" dist/config.js && npx serve -s dist -l $PORT'"

# Para backend services, Railway detectará automáticamente Express.js
