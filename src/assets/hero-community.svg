  <text x="680" y="707" text-anchor="middle" font-size="44" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" fill="#2A4B72">SOLICITA</text>

  <text x="520" y="754" text-anchor="middle" font-size="34" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" fill="#26364B">Publica lo que</text>
  <text x="520" y="794" text-anchor="middle" font-size="34" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" fill="#26364B">ya no usas y</text>
  <text x="520" y="834" text-anchor="middle" font-size="34" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" fill="#26364B">puede servir</text>
  <text x="520" y="874" text-anchor="middle" font-size="34" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" fill="#26364B">a otros.</text>

  <text x="680" y="754" text-anchor="middle" font-size="34" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" fill="#26364B">Encuentra lo que</text>
  <text x="680" y="794" text-anchor="middle" font-size="34" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" fill="#26364B">necesitas y</text>
  <text x="680" y="834" text-anchor="middle" font-size="34" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" fill="#26364B">solicitalo.</text>

