  <text x="192" y="166" text-anchor="middle" font-size="42" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" fill="#264830">Dale una</text>
  <text x="192" y="212" text-anchor="middle" font-size="42" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" fill="#264830">segunda vida</text>
  <text x="192" y="258" text-anchor="middle" font-size="42" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" fill="#264830">a las cosas</text>

  <text x="1088" y="170" text-anchor="middle" font-size="44" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" fill="#223A56">Una comunidad</text>
  <text x="1088" y="218" text-anchor="middle" font-size="44" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" fill="#223A56">que comparte</text>
  <text x="1088" y="266" text-anchor="middle" font-size="44" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" fill="#223A56">y se ayuda</text>

  <text x="600" y="288" text-anchor="middle" font-size="43" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" fill="#26364B">Lo que para ti ya no</text>
  <text x="600" y="338" text-anchor="middle" font-size="43" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" fill="#26364B">utilizas, para alguien</text>
  <text x="600" y="388" text-anchor="middle" font-size="43" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" fill="#26364B">mas puede ser</text>
  <text x="600" y="438" text-anchor="middle" font-size="43" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" fill="#26364B">exactamente lo que</text>
  <text x="600" y="488" text-anchor="middle" font-size="43" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" fill="#26364B">necesita.</text>

